services:
  - type: web
    name: blanchisserie-molieres
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /data
      - key: NODE_ENV
        value: production
    disk:
      name: blanchisserie-data
      mountPath: /data
      sizeGB: 1
